services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Persistent storage in Postgres; FSM state in Redis.
      # Set DATABASE_URL in .env to use a managed database (e.g. Neon) instead
      # of the local one — the value here is only the fallback.
      DATABASE_URL: ${DATABASE_URL:-postgresql://bot:botpass@db:5432/botdb}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Без PORT health-сервер не поднимается вовсе, и выкату нечем сверить,
      # доехал ли код: он честно скажет «версия не сверена» и на этом всё.
      PORT: ${PORT:-8080}
    ports:
      # Только на localhost. Наружу этот адрес отдавать незачем: он говорит
      # версию бота и состояние приёма сообщений — это подсказка тому, кто
      # будет искать, чем нас ковырять.
      - "127.0.0.1:${PORT:-8080}:${PORT:-8080}"
    depends_on:
      - db
      - redis
    volumes:
      - bot_data:/app/data   # photos + legacy fallback

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: botpass
      POSTGRES_DB: botdb
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  bot_data:
  pg_data:
  redis_data:
